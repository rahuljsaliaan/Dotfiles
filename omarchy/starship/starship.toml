add_newline = false

# Tokyo Night, in the plain style of the Claude Code status line
# (~/.claude/statusline.sh), with the folder on one rounded accent-blue pill
# (like the active workspace in the bar) so it is the first thing you see:
#
#   󰉋 omarchy  main !? │  .venv                          󱎫 1s234ms
#   ❯
#
# Everything after the folder is a coloured icon and text on the terminal's
# own background. Segments after git start with their own dim divider, so a
# divider only shows when its segment does. No clock: the top bar has one.

format = """
$directory\
$git_branch$git_status\
$python$nodejs$rust$golang\
$docker_context$kubernetes\
$fill\
$cmd_duration\
$line_break\
$character"""

[fill]
symbol = " "

# ========================
# DIRECTORY (the accent pill)
# ========================
[directory]
style = "fg:#1a1b26 bg:#7aa2f7 bold"
truncation_length = 2
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "fg:#f7768e"
format = "[](fg:#7aa2f7)[󰉋 $path]($style)[](fg:#7aa2f7)[$read_only]($read_only_style)"

# ========================
# GIT
# ========================
[git_branch]
symbol = " "
style = "fg:#c0caf5"
format = " [$symbol](fg:#bb9af7)[$branch]($style)"

[git_status]
style = "fg:#e0af68"
format = "([ $all_status$ahead_behind]($style))"

# ========================
# LANGUAGES
# ========================
[python]
symbol = " "
style = "fg:#c0caf5"
format = "[ │ ](fg:#565f89)[$symbol](fg:#9ece6a)[$virtualenv]($style)"
# Only when a virtualenv is active: with no files to detect, the module shows
# solely because $VIRTUAL_ENV is set, and stays hidden otherwise.
detect_extensions = []
detect_files = []
detect_folders = []

[nodejs]
symbol = " "
style = "fg:#c0caf5"
format = "[ │ ](fg:#565f89)[$symbol](fg:#9ece6a)[$version]($style)"

[rust]
symbol = " "
style = "fg:#c0caf5"
format = "[ │ ](fg:#565f89)[$symbol](fg:#ff9e64)[$version]($style)"

[golang]
symbol = " "
style = "fg:#c0caf5"
format = "[ │ ](fg:#565f89)[$symbol](fg:#7dcfff)[$version]($style)"

# ========================
# CONTAINERS
# ========================
[docker_context]
symbol = " "
style = "fg:#c0caf5"
format = "[ │ ](fg:#565f89)[$symbol](fg:#7dcfff)[$context]($style)"
only_with_files = true

[kubernetes]
symbol = "󱃾 "
style = "fg:#c0caf5"
format = "[ │ ](fg:#565f89)[$symbol](fg:#7dcfff)[$context]($style)"

# ========================
# CMD DURATION
# ========================
[cmd_duration]
min_time = 100
show_milliseconds = true
style = "fg:#e0af68"
format = "[󱎫 ](fg:#565f89)[$duration]($style)"

# ========================
# CHARACTER
# ========================
[character]
success_symbol = "[❯](bold fg:#7aa2f7)"
error_symbol = "[❯](bold fg:#f7768e)"
