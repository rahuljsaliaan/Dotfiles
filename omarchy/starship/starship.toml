add_newline = false

# Plain style, matching the Claude Code status line (~/.claude/statusline.sh):
# a coloured icon, the text, and a dim │ between segments, on the terminal's
# own background instead of powerline blocks. Tokyo Night colours.
#
#   󰉋 ~/Work/omarchy │  main !1 ?2 │  .venv               󱎫 1.2s │ 󰥔 17:05
#   ❯
#
# Each segment after the folder starts with its own divider, so a divider only
# shows when the segment does.

format = """
$directory\
$git_branch$git_status\
$python$nodejs$rust$golang\
$docker_context$kubernetes\
$fill\
$cmd_duration$time\
$line_break\
$character"""

[fill]
symbol = " "

# ========================
# DIRECTORY
# ========================
[directory]
style = "fg:#c0caf5 bold"
truncation_length = 2
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "fg:#f7768e"
format = "[󰉋 ](fg:#7aa2f7)[$path]($style)[$read_only]($read_only_style)"

# ========================
# GIT
# ========================
[git_branch]
symbol = " "
style = "fg:#c0caf5"
format = "[ │ ](fg:#565f89)[$symbol](fg:#bb9af7)[$branch]($style)"

[git_status]
style = "fg:#e0af68"
format = "([ $all_status$ahead_behind]($style))"

# ========================
# LANGUAGES
# ========================
[python]
symbol = " "
style = "fg:#c0caf5"
format = "[ │ ](fg:#565f89)[$symbol](fg:#9ece6a)[$virtualenv]($style)"
# Only when a virtualenv is active: with no files to detect, the module shows
# solely because $VIRTUAL_ENV is set, and stays hidden otherwise.
detect_extensions = []
detect_files = []
detect_folders = []

[nodejs]
symbol = " "
style = "fg:#c0caf5"
format = "[ │ ](fg:#565f89)[$symbol](fg:#9ece6a)[$version]($style)"

[rust]
symbol = " "
style = "fg:#c0caf5"
format = "[ │ ](fg:#565f89)[$symbol](fg:#ff9e64)[$version]($style)"

[golang]
symbol = " "
style = "fg:#c0caf5"
format = "[ │ ](fg:#565f89)[$symbol](fg:#7dcfff)[$version]($style)"

# ========================
# CONTAINERS
# ========================
[docker_context]
symbol = " "
style = "fg:#c0caf5"
format = "[ │ ](fg:#565f89)[$symbol](fg:#7dcfff)[$context]($style)"
only_with_files = true

[kubernetes]
symbol = "󱃾 "
style = "fg:#c0caf5"
format = "[ │ ](fg:#565f89)[$symbol](fg:#7dcfff)[$context]($style)"

# ========================
# CMD DURATION
# ========================
[cmd_duration]
min_time = 100
show_milliseconds = true
style = "fg:#e0af68"
format = "[󱎫 ](fg:#565f89)[$duration]($style)[ │ ](fg:#565f89)"

# ========================
# TIME
# ========================
[time]
disabled = false
time_format = "%H:%M"
style = "fg:#c0caf5"
format = "[󰥔 ](fg:#565f89)[$time]($style)"

# ========================
# CHARACTER
# ========================
[character]
success_symbol = "[❯](bold fg:#7aa2f7)"
error_symbol = "[❯](bold fg:#f7768e)"
