# Ctrl + Alt + H/J/K/L move between tmux and herdr panes. Fcitx's keyboard
# engine took Ctrl + Alt + H (toggle word hints) and Ctrl + Alt + J (word hints
# once) before the terminal saw them, so both are switched off.

# Candidates per page
# PageSize=5
# Enable emoji in hint
# EnableEmoji=True
# Enable emoji in quickphrase
# EnableQuickPhraseEmoji=True
# Choose key modifier
# Choose Modifier=Alt
# Enable hint by default
# EnableHintByDefault=False
# Trigger hint mode
Hint Trigger=
# Trigger hint mode for one time
One Time Hint Trigger=
# Use new compose behavior
# UseNewComposeBehavior=True
# Type special characters with long press
# EnableLongPress=False

# [PrevCandidate]
# 0=Shift+Tab

# [NextCandidate]
# 0=Tab

# [LongPressBlocklist]
# 0=konsole
# 1=org.kde.konsole

