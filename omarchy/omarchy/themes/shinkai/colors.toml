# Shinkai (深海, "deep sea"): Tokyo Night's UI feel sunk into Material Ocean.
# Surfaces are a deep-sea navy (Material Ocean's ink turned towards blue, so
# it sits between the blue accent and the lavender text), the UI text and blue
# accent come from Tokyo Night, the syntax hues from Material. Every themed
# app is generated from this file; neovim.lua, shell.toml, claude.json,
# btop.theme and obsidian.css repeat its colours and change with it.
mode = "dark"

accent = "#82aaff"
selection = "#1b3457"
muted = "#464b5d"

background = "#0c1523"
dark_background = "#09111c"
darker_background = "#070b12"
lighter_background = "#162740"

foreground = "#a6accd"
dark_foreground = "#525975"
light_foreground = "#b8bedd"
bright_foreground = "#c8d3f5"

red = "#f07178"
yellow = "#ffcb6b"
orange = "#f78c6c"
green = "#c3e88d"
cyan = "#89ddff"
blue = "#82aaff"
magenta = "#c792ea"
brown = "#8f5f54"

# Brights: the same hue and nearly the same saturation as each base colour,
# a little lighter (less for colours that are already light), worked out in
# OKLCH, so a bright icon or label reads as the same colour family.
bright_red = "#ff898e"
bright_yellow = "#fed282"
bright_green = "#ccf196"
bright_cyan = "#9ce1fe"
bright_blue = "#8cb1fe"
bright_magenta = "#dba5fe"
