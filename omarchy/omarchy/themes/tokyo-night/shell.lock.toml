# Personal: the lock screen matches the rest of the desktop: frosted glass
# (theme background, partly see-through) with the same soft blue -> purple
# border as focused windows and panels, red only on a wrong password.
# The stock Tokyo Night theme ships its own shell.lock.toml, which replaces
# the whole [lock] section of shell.toml when the theme is applied, so the
# lock colours have to live here, not in this overlay's shell.toml.
background       = "#1a1b26"
background-alpha = 0.60
text             = "#c0caf5"
placeholder      = "#565f89"
text-error       = "#f7768e"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#f7768e"
