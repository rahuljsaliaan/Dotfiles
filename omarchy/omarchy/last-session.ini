# omarchy-last-session settings. Every value below is the default the plugin
# ships with. A saved change takes effect within a minute, with no restart.
# Lists are comma separated. A key left out keeps its default, and a section
# left out keeps its whole table.

[general]

# Window classes never saved or restored. The shell's and the compositor's own
# (org.quickshell, xembedsniproxy, hyprland-dialog) are always left out.
# Find a window's class with:  hyprctl clients -j | jq '.[].class'
exclude = org.omarchy.agent

# Apps that reopen their own windows, so they are launched once per process and
# sent SIGTERM at shutdown to write their windows down first. Every browser under
# [chromium-browsers] is one as well. Add your editor if it restores its own windows.
session_keeping = code, code-oss, code-insiders, codium

# Apps launched once for all of their windows, because a second launch joins the
# first, but never signalled: a SIGTERM raises a save prompt, and they come back
# offering document recovery instead of the document.
single_instance = teams-for-linux, soffice, libreoffice-writer, libreoffice-calc, libreoffice-impress, libreoffice-draw, libreoffice-math, libreoffice-base, libreoffice-startcenter, gimp

# Programs relaunched inside their terminal, in the directory they were in.
tui_programs = yazi, nvim, vim, btop, htop, ranger, lf

# What a terminal runs at its prompt. A terminal at a prompt reopens in that shell's directory.
shells = fish, zsh, bash, sh, nu

# Where snapshots are kept. Empty for ~/.local/state/omarchy-last-session.
state_dir =

# Seconds vanished windows stay unsaved. Omarchy powers off two seconds after
# closing every window, and this outlasts that, so a half-closed desktop is never saved.
settle_delay = 10

# Seconds between saves when no window has opened, closed or moved. Titles and
# floating geometry change without such an event.
save_interval = 60

# Seconds restore waits for the windows it launched. One slower than this is left unplaced.
sweep_timeout = 30

# Seconds restore waits for an app's windows to turn up and for their titles to stop
# changing, since a browser titles a window before its page has loaded and the
# titles are what tell its windows apart.
title_settle = 5

# Restore does nothing when more windows than this are already open, so enabling
# the plugin mid-session reopens nothing.
max_preexisting_windows = 3

[terminals]
# Terminals, by window class: the binary, the flag that sets the working directory,
# and the flag that runs a program in it, when the terminal has one. A directory flag
# ending in = is joined to its value, which is the only form ghostty accepts.
kitty = kitty, -d
foot = foot, -D
Alacritty = alacritty, --working-directory, -e
com.mitchellh.ghostty = ghostty, --working-directory=, -e

[chromium-browsers]
# Chromium-based browsers, by window class: the profile directory under ~/.config.
# Each is relaunched with --restore-last-session after its profiles are marked as
# cleanly exited, since Chromium restores no tabs after what it took for a crash.
brave-browser = BraveSoftware/Brave-Browser
Chromium = chromium
chromium = chromium
chromium-browser = chromium
google-chrome = google-chrome
microsoft-edge = microsoft-edge

# Nothing to set for Steam or an AppImage: their command lines cannot be
# replayed, so each is relaunched through its .desktop entry. Firefox and Zen
# restore their own session with no help.
