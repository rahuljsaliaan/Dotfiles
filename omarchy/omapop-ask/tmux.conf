# tmux config for omapop-ask's own server (tmux -L agents). Kept bare on
# purpose: the window should look like a plain agent terminal, so there is no
# status bar and no Omarchy keybindings. Prefix is the default Ctrl+B.
set -g status off
set -g mouse on
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on
set -g extended-keys on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",foot*:RGB,xterm*:RGB"
# The window title is the session name, which omapop-ask uses to find it.
set -g set-titles on
set -g set-titles-string "#S"
