# Nautilus as the file chooser ("Open"/"Save" dialogs) on Hyprland.
#
# Nautilus serves org.freedesktop.impl.portal.FileChooser itself, but ships no
# .portal file, and xdg-desktop-portal reads backends from one folder only. So
# point it at a user folder holding nautilus.portal plus links to every system
# backend, refreshed at each start so new or removed packages are picked up.
# With that folder set, the portal also reads its *-portals.conf only from
# there, so ~/.config/xdg-desktop-portal/hyprland-portals.conf (which routes
# FileChooser to nautilus) is linked in as well.
[Service]
Environment=XDG_DESKTOP_PORTAL_DIR=%h/.local/share/xdg-desktop-portal/portals
ExecStartPre=/bin/sh -c 'd=%h/.local/share/xdg-desktop-portal/portals; mkdir -p "$d"; find "$d" -xtype l -delete; ln -sf /usr/share/xdg-desktop-portal/portals/*.portal %h/.config/xdg-desktop-portal/*-portals.conf "$d"/'
