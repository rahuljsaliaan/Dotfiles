[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=JetBrains Mono:style=SemiBold:size=9.5,JetBrainsMono Nerd Font:size=9.5
# Bold text (the Starship prompt, Neovim headings) one step heavier than the
# SemiBold regular text, so it stands out on the coloured prompt segments.
font-bold=JetBrains Mono:style=Bold:size=9.5,JetBrainsMono Nerd Font:style=Bold:size=9.5
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
