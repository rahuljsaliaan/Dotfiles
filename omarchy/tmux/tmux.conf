# Prefix
set -g prefix C-Space
set -g prefix2 None
bind -N "Send prefix" C-Space send-prefix

# Config and help
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Show Tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"

# Vi mode for copy
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls
bind -N "Split pane vertically" -n M-Enter split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" -n M-Escape kill-pane

bind -N "Split pane vertically" h split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" v split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" x kill-pane

bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane right" -n C-M-Right select-pane -R
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane down" -n C-M-Down select-pane -D

bind -N "Resize pane left" -n C-M-S-Left resize-pane -L 5
bind -N "Resize pane down" -n C-M-S-Down resize-pane -D 5
bind -N "Resize pane up" -n C-M-S-Up resize-pane -U 5
bind -N "Resize pane right" -n C-M-S-Right resize-pane -R 5

# Window navigation
# Rename and command prompts open in a floating box (~/.local/bin/tmux-prompt)
# instead of tmux's command prompt, which takes over the whole status line and
# hides the session name while typing. Enter accepts, Esc cancels.
bind -N "Rename window" r display-popup -E -w 60 -h 3 -x C -y C -T " rename window " "~/.local/bin/tmux-prompt window"
bind -N "Rename window" , display-popup -E -w 60 -h 3 -x C -y C -T " rename window " "~/.local/bin/tmux-prompt window"
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Kill window" k kill-window

bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9

bind -N "Previous window" -n M-Left select-window -t -1
bind -N "Next window" -n M-Right select-window -t +1
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind -N "Rename session" R display-popup -E -w 60 -h 3 -x C -y C -T " rename session " "~/.local/bin/tmux-prompt session"
bind -N "Rename session" '$' display-popup -E -w 60 -h 3 -x C -y C -T " rename session " "~/.local/bin/tmux-prompt session"
bind -N "Command palette" : display-popup -E -w 80% -h 60% -x C -y C -T " tmux command " "~/.local/bin/tmux-prompt command"
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n

bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"
set -sg escape-time 10

# Status bar
# Top, in line with the Omarchy bar, and away from Neovim's own status line at
# the bottom so the two bars don't stack. The command line opens here too; the
# message styles and prompts below make it read as a command bar.
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme: the Starship prompt's design, as Neovim's status line draws it too:
# the session on one rounded accent pill (like Starship's folder pill and the
# editor's mode pill), window names as plain text split by a dim │, the
# current one in the accent and bold, the host name dim, no blocks or arrows.
# Colours are the current Omarchy theme's colors.toml keys (the ones the
# Starship template uses), set as @thm_* options by theme-colors.sh, here at
# start and from a theme-set hook on every switch. The named colours below are
# the fallback for when no theme can be read.
set -g @thm_bg black
set -g @thm_fg default
set -g @thm_bright white
set -g @thm_dim brightblack
set -g @thm_accent blue
set -g @thm_magenta magenta
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=#{@thm_accent},bg=default]\uE0B6#[fg=#{@thm_bg},bg=#{@thm_accent},bold] #S #[fg=#{@thm_accent},bg=default,nobold]\uE0B4 "
set -g status-right "#[fg=#{@thm_accent},bold]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#{@thm_dim},nobold]#h "
# Other windows in the theme's text colour (the muted grey is about 2:1, too
# faint for a name); the current one stands out by the accent and bold.
set -g window-status-format "#[fg=#{@thm_fg},nobold] #I:#W "
set -g window-status-current-format "#[fg=#{@thm_accent},bold] #I:#W "
# tmux 3.8 also underlines the current window by default; the accent and bold
# already mark it, as in Starship and Neovim.
set -g window-status-current-style "default"
set -g window-status-separator "#[fg=#{@thm_dim},nobold]│"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
# The command line and rename prompts take over the status line while open;
# a raised surface and a clear prompt make that read as a command bar, not a
# glitch.
set -g message-style "bg=black,fg=blue,bold"
set -g message-command-style "bg=black,fg=magenta,bold"
# The floating prompt box: rounded like the windows, outlined in the theme's
# accent, on the terminal's own (glassy) background.
set -g popup-border-lines rounded
set -g popup-border-style "fg=blue"
set -g popup-style "bg=default"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# Exact theme colours over the named defaults above (see the theme section).
run-shell "~/.config/tmux/theme-colors.sh"
