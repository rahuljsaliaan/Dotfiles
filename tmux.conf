# tmux configuration -- companion to wezterm.lua in this repo

# ==============================
# TERMINAL / FONT
# ==============================
# tmux has no font setting of its own: glyphs are drawn by the host terminal,
# which is Hack Nerd Font Bold (see wezterm.lua). What tmux can do is avoid
# degrading it -- declare a terminal supporting 24-bit colour and italics, so
# the Tokyo Night palette below matches wezterm exactly and the Nerd Font
# glyphs in the status line render rather than falling back to tofu.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"

# ==============================
# GENERAL
# ==============================
set -g mouse on
set -g history-limit 10000       # matches scrollback_lines in wezterm.lua
set -sg escape-time 10           # don't mistake a bare Esc for a meta sequence
set -g focus-events on
set -g set-clipboard on          # matches alacritty's old save_to_clipboard

# Count from 1: the 0 key is the awkward reach on a number row
set -g base-index 1
setw -g pane-base-index 1
setw -g renumber-windows on

# ==============================
# SPLITS
# ==============================
# Alt+Shift++  ->  new pane to the RIGHT
# Alt+Shift+-  ->  new pane BELOW
#
# Bound with -n (root table) so they fire on a bare keypress, no prefix needed.
#
# Each is bound in two forms because the character a shifted key produces is
# layout dependent: on a US layout Shift+= is "+" and Shift+- is "_", so tmux
# may receive M-+ or M-=, and M-_ or M--. Binding both spellings per axis means
# the same physical keypress works either way.
#
# Note tmux's own naming is the reverse of how it reads: -h ("horizontal")
# splits side by side, -v ("vertical") stacks. The intent above is what counts.
bind -n M-+ split-window -h -c "#{pane_current_path}"
bind -n M-= split-window -h -c "#{pane_current_path}"
bind -n M-_ split-window -v -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"

# New panes open in the directory of the pane they were split from, rather than
# wherever the session was first started.

# ==============================
# PANE NAVIGATION
# ==============================
# Alt + arrows move between panes, no prefix needed. select-pane's -L/-R/-U/-D
# are directional rather than positional, so this follows the visual layout
# however the panes were split.
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ==============================
# COLORS (Tokyo Night -- same values as wezterm.lua)
# ==============================
# bg #222436  fg #c0caf5  blue #7aa2f7  magenta #bb9af7
# yellow #e0af68  dim #414868  darkest #1a1b26

set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#222436,fg=#c0caf5"

set -g status-left-length 40
set -g status-right-length 80

set -g status-left " #[fg=#7aa2f7,bold]  #S #[fg=#414868]│"
set -g status-right "#[fg=#414868]│ #[fg=#bb9af7]  %a %d %b #[fg=#414868]│ #[fg=#e0af68]  %H:%M "

setw -g window-status-format " #[fg=#414868]#I #[fg=#c0caf5]#W "
setw -g window-status-current-format " #[fg=#7aa2f7,bold]#I #[fg=#7aa2f7,bold]#W "
setw -g window-status-separator ""

set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"

set -g message-style "bg=#7aa2f7,fg=#1a1b26,bold"
setw -g mode-style "bg=#7aa2f7,fg=#1a1b26"
