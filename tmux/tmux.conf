# tmux configuration -- companion to wezterm.lua in this repo

# ==============================
# TERMINAL / FONT
# ==============================
# tmux has no font setting of its own: glyphs are drawn by the host terminal,
# which is Hack Nerd Font Bold (see wezterm.lua). What tmux can do is avoid
# degrading it -- declare a terminal supporting 24-bit colour and italics, so
# the Tokyo Night palette below matches wezterm exactly and the Nerd Font
# glyphs in the status line render rather than falling back to tofu.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"

# Undercurl passthrough. Neovim draws LSP diagnostics as coloured undercurls;
# tmux does not advertise those capabilities by default, so without these they
# degrade to plain underlines and lose their colour.
set -ga terminal-overrides ",*:Smulx=\E[4::%p1%dm"
set -ga terminal-overrides ",*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"

# ==============================
# GENERAL
# ==============================
set -g mouse on
set -g history-limit 10000       # matches scrollback_lines in wezterm.lua
set -sg escape-time 10           # don't mistake a bare Esc for a meta sequence
set -g focus-events on

# `:recolor` at the command prompt (prefix + :) repaints the current session's
# badge and the window frame in a random colour from the palette, skipping
# whichever one is on screen so it always visibly changes. Index 100 is clear of
# the aliases tmux ships at 0-6.
#
# No argument: command-alias does not substitute %% -- verified on 3.4, it
# arrives at the command literally -- so an alias cannot carry a colour. For a
# chosen one, prefix + C prompts, since command-prompt does substitute %%.
set -s command-alias[100] 'recolor=run-shell "~/.local/bin/tmux-dev --recolor"'
bind C command-prompt -p "accent:" "run-shell '~/.local/bin/tmux-dev --recolor %%'"

# Let a program inside a pane send an escape sequence straight through to the
# terminal. dev-session.sh uses it to hand wezterm the repo's accent colour for
# the window frame; without this tmux consumes the sequence instead.
set -g allow-passthrough on
set -g set-clipboard on          # matches alacritty's old save_to_clipboard

# Count from 1: the 0 key is the awkward reach on a number row
set -g base-index 1
setw -g pane-base-index 1
setw -g renumber-windows on

# ==============================
# SPLITS
# ==============================
# Alt+Shift++  ->  new pane to the RIGHT
# Alt+Shift+-  ->  new pane BELOW
#
# Bound with -n (root table) so they fire on a bare keypress, no prefix needed.
#
# Each is bound in two forms because the character a shifted key produces is
# layout dependent: on a US layout Shift+= is "+" and Shift+- is "_", so tmux
# may receive M-+ or M-=, and M-_ or M--. Binding both spellings per axis means
# the same physical keypress works either way.
#
# Note tmux's own naming is the reverse of how it reads: -h ("horizontal")
# splits side by side, -v ("vertical") stacks. The intent above is what counts.
bind -n M-+ split-window -h -c "#{pane_current_path}"
bind -n M-= split-window -h -c "#{pane_current_path}"
bind -n M-_ split-window -v -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"

# New panes open in the directory of the pane they were split from, rather than
# wherever the session was first started.

# ==============================
# PANE NAVIGATION
# ==============================
# Alt + arrows move between panes, no prefix needed. select-pane's -L/-R/-U/-D
# are directional rather than positional, so this follows the visual layout
# however the panes were split.
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ==============================
# COLORS (Tokyo Night -- same values as wezterm.lua)
# ==============================
# bg #222436  fg #c0caf5  blue #7aa2f7  magenta #bb9af7
# yellow #e0af68  dim #414868  darkest #1a1b26

set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#222436,fg=#c0caf5"

set -g status-left-length 40
set -g status-right-length 80

set -g status-left " #[fg=#7aa2f7,bold]  #S #[fg=#414868]│"
set -g status-right "#[fg=#414868]│ #[fg=#bb9af7]  %a %d %b #[fg=#414868]│ #[fg=#e0af68]  %H:%M "

setw -g window-status-format " #[fg=#414868]#I #[fg=#c0caf5]#W "
setw -g window-status-current-format " #[fg=#7aa2f7,bold]#I #[fg=#7aa2f7,bold]#W "
setw -g window-status-separator ""

# ==============================
# WHICH PANE AM I IN
# ==============================
# Border colour alone cannot answer this. tmux draws one divider between two
# panes and paints it with pane-active-border-style when it borders the active
# pane -- which, with exactly two panes, it always does. So in the common
# left/right split the divider is bright blue no matter which side has focus,
# and carries no information. Verified: same glyph, same attributes either way.
#
# Hence two cues that belong to a *pane* rather than to a shared edge.
set -g pane-border-style "fg=#414868"

set -g pane-active-border-style "fg=#7aa2f7"

# 1. A labelled header per pane: index, running command, and a blue bar on the
#    one with focus. This is the unambiguous cue -- it survives any pane count,
#    and works even in a pane running Neovim, which repaints its own background
#    and so defeats the dimming below.
#
#    The inactive arm opens with two spaces where the active arm has "▌ ", so
#    the labels line up in a column instead of shifting as focus moves.
#    Commas inside #[...] are escaped as "#," -- an unescaped one would end the
#    conditional's first arm early.
#
#    One pane-local user option customises a header:
#      @role   label to show instead of "<index> <command>"
#    dev-session.sh sets it so each pane in a project layout says what it is for
#    rather than which command it happens to be running. A pane without it --
#    any ordinary split -- renders exactly as it did before.
#
#    Colour here is focus and nothing else: blue on the focused pane, grey on
#    the rest, the same rule the borders follow. Panes were previously tinted
#    per role as a second identity cue; that put four colours on screen to say
#    something the labels already said in words.
set -g pane-border-format "#{?pane_active,#[fg=#7aa2f7#,bold]▌ ,#[fg=#414868]  }#{?@role,#{@role},#{pane_index} #{pane_current_command}} "

#    A single pane has nothing to differentiate, and the header there is one
#    wasted row of chrome, so it is switched on only while the window is split.
#    window-layout-changed covers both directions -- splitting a pane and
#    closing one both change the layout.
set-hook -g window-layout-changed 'if -F "#{==:#{window_panes},1}" "setw pane-border-status off" "setw pane-border-status top"'

# 2. A heavier border line, so the divider reads as a real edge rather than a
#    hairline. This replaces shading the inactive panes a darker colour, which
#    worked but tinted half the screen to say one thing.
#
#    It applies to every border, not just the active one -- tmux has no
#    per-state line weight. That is fine: weight makes the panes legible as
#    separate regions, and the colours above plus the "▌" in the header say
#    which one has focus. Worth knowing that with exactly two panes the colour
#    alone still cannot -- see the note at the top -- so the header is doing
#    that work, which is why it stays.
set -g pane-border-lines "heavy"

set -g message-style "bg=#7aa2f7,fg=#1a1b26,bold"
setw -g mode-style "bg=#7aa2f7,fg=#1a1b26"
